<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classified Note</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            max-width: 500px;
            padding: 2rem;
            background: #1e293b;
            border-radius: 8px;
            border: 1px: #334155;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        h1 { color: #f87171; margin-bottom: 0.5rem; }
        code { background: #0f172a; padding: 0.2rem 0.4rem; border-radius: 4px; color: #38bdf8; }
        a { color: #38bdf8; text-decoration: none; display: inline-block; margin-top: 1.5rem; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔒 Classified Note</h1>
        <p>The note you're trying to reach at <code id="requested-path"></code> is either missing or intentionally kept private in this vault.</p>
        <p style="font-size: 0.9rem; color: #94a3b8;">This is a restricted-access node.</p>
        <a href="/">← Return to Public Vault</a>
    </div>

    <script>
        // Capture the URL path that triggered the 404
        const path = window.location.pathname;
        document.getElementById('requested-path').textContent = path;
    </script>
</body>
</html>
